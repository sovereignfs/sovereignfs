name: Docs

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    paths:
      - 'docs/**'
      - 'cli/bin/workbench.js'
      - 'workbench.manifest.json'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'cli/bin/workbench.js'
      - 'workbench.manifest.json'
      - '.github/workflows/docs.yml'
    tags:
      - 'docs-v*'
  # Content is fetched fresh from sovereign/sovereign-os/sovereign-edge at
  # build time (not pinned) — a PR or push here can pass, then a later
  # upstream commit in one of those repos makes the *next* deploy fail with
  # no PR of ours to catch it (this is exactly how the 2026-08 dead-link
  # incident reached an actual deploy run unnoticed: every source of drift
  # was upstream, not in this repo's own diff). A daily schedule surfaces
  # that drift within a day instead of at the next manual deploy.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch: # manually publish the current selected ref, or run this build check on demand

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    # Runs on: a PR touching the paths above (unless draft/skip-ci); a
    # direct push to main touching those same paths (the "no PR" path this
    # repo's own workflow allows — see AGENTS.md); and the daily schedule,
    # which re-fetches and rebuilds regardless of whether anything changed
    # here, to catch drift originating entirely in the upstream repos.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       !contains(github.event.pull_request.labels.*.name, 'skip-ci')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml

      # Content isn't checked in — fetched fresh from sovereign on every
      # build. --https because this runner has no SSH key for GitHub.
      - name: Fetch docs content from sovereign
        run: ./workbench.sh docs fetch --https

      - name: Install dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build docs
        working-directory: docs
        run: pnpm exec vitepress build

  deploy:
    name: Deploy docs
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/docs-v') || github.event_name == 'workflow_dispatch'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Fetch docs content from sovereign
        run: ./workbench.sh docs fetch --https

      - name: Install dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build docs
        working-directory: docs
        run: pnpm exec vitepress build

      - name: Deploy to sovereignfs.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DOCS_DEPLOY_TOKEN }}
          external_repository: sovereignfs/sovereignfs.github.io
          publish_branch: main
          publish_dir: docs/.vitepress/dist
          commit_message: 'deploy: docs from ${{ github.sha }}'
