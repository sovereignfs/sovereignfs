name: Docs

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    paths:
      - 'docs/**'
      - 'cli/bin/workbench.js'
      - 'workbench.manifest.json'
      - '.github/workflows/docs.yml'
  push:
    tags:
      - 'docs-v*'
  workflow_dispatch: # manually publish the current selected ref

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'skip-ci')

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml

      # Content isn't checked in — fetched fresh from sovereign on every
      # build. --https because this runner has no SSH key for GitHub.
      - name: Fetch docs content from sovereign
        run: ./workbench.sh docs fetch --https

      - name: Install dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build docs
        working-directory: docs
        run: pnpm exec vitepress build

  deploy:
    name: Deploy docs
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/docs-v') || github.event_name == 'workflow_dispatch'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Fetch docs content from sovereign
        run: ./workbench.sh docs fetch --https

      - name: Install dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build docs
        working-directory: docs
        run: pnpm exec vitepress build

      - name: Deploy to sovereignfs.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DOCS_DEPLOY_TOKEN }}
          external_repository: sovereignfs/sovereignfs.github.io
          publish_branch: main
          publish_dir: docs/.vitepress/dist
          commit_message: 'deploy: docs from ${{ github.sha }}'
